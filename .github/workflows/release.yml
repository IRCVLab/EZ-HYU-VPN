name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for verified platform workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in macOS Ubuntu Windows; do
            run_id=""
            for attempt in $(seq 1 120); do
              run_id="$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$run_id" ]; then
                status="$(gh run view "$run_id" --json status --jq .status 2>/dev/null || true)"
                [ "$status" = completed ] && break
              fi
              sleep 15
            done
            [ -n "$run_id" ] || { echo "No $workflow workflow run found" >&2; exit 1; }
            conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
            [ "$conclusion" = success ] || { echo "$workflow workflow failed: $conclusion" >&2; exit 1; }
            mkdir -p "artifacts/$workflow"
            gh run download "$run_id" --dir "artifacts/$workflow"
          done
      - name: Validate portable release checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          checksums = sorted(Path("artifacts").rglob("*.sha256"))
          if len(checksums) != 3:
              raise SystemExit(f"expected 3 checksum assets, found {len(checksums)}")
          for checksum in checksums:
              raw = checksum.read_bytes()
              if b"\r" in raw or not raw.endswith(b"\n") or raw.count(b"\n") != 1:
                  raise SystemExit(f"checksum must use LF without CR: {checksum}")
              match = re.fullmatch(rb"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]+)\n", raw)
              if match is None:
                  raise SystemExit(f"invalid checksum format: {checksum}")
              referenced = match.group(2).decode("ascii")
              sibling = checksum.with_name(checksum.name.removesuffix(".sha256"))
              if referenced != sibling.name:
                  raise SystemExit(f"checksum must reference its sibling basename: {checksum}")
              if not sibling.is_file():
                  raise SystemExit(f"checksum sibling is missing: {sibling}")
              actual = hashlib.sha256(sibling.read_bytes()).hexdigest().encode("ascii")
              if actual != match.group(1):
                  raise SystemExit(f"checksum digest mismatch: {checksum}")
          print("portable release checksums verified")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( \
            -name '*.dmg' -o -name '*.deb' -o -name '*.msi' -o -name '*.sha256' \
          \) -print | sort)
          [ "${#files[@]}" -eq 6 ] || { printf 'Unexpected release files:\n%s\n' "${files[*]}" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "HYU VPN $GITHUB_REF_NAME" \
            --generate-notes
