[workspace]
resolver = "3"
members = [
    "rust/crates/hyu-vpn-core",
    "rust/crates/hyu-vpn-protocol",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
data-encoding = "2.9"
fs2 = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
