[workspace]
resolver = "3"
members = [
    "rust/crates/hyu-vpn-core",
    "rust/crates/hyu-vpn-daemon",
    "rust/crates/hyu-vpn-protocol",
    "rust/crates/hyu-vpn-platform-linux",
    "rust/apps/hyu-vpn-gtk",
    "rust/apps/hyu-vpn-hip",
    "rust/apps/hyu-vpn-linux-service",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
data-encoding = "2.9"
fs2 = "0.4"
hmac = "0.12"
libc = "0.2"
ksni = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net", "fs", "signal"] }
zeroize = { version = "1.8", features = ["derive"] }
