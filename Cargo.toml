[workspace]
resolver = "3"
members = [
    "rust/crates/hyu-vpn-core",
    "rust/crates/hyu-vpn-protocol",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
