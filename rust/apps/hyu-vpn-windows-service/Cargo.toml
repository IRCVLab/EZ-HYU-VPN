[package]
name = "hyu-vpn-windows-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
hyu-vpn-core = { path = "../../crates/hyu-vpn-core" }
hyu-vpn-daemon = { path = "../../crates/hyu-vpn-daemon" }
hyu-vpn-platform-windows = { path = "../../crates/hyu-vpn-platform-windows" }
hyu-vpn-protocol = { path = "../../crates/hyu-vpn-protocol" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
